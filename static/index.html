<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agente de Restaurante</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 20px;
      color: #1f2937;
    }
    .contenedor {
      max-width: 1120px;
      margin: 0 auto;
    }
    h1 {
      margin: 0 0 16px 0;
      font-size: 1.6rem;
    }
    .layout {
      display: grid;
      grid-template-columns: 1fr 310px;
      gap: 18px;
      align-items: start;
    }
    .panel-chat {
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      height: 78vh;
      min-height: 500px;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      background: #fafafa;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      padding: 10px 14px;
      border-radius: 10px;
      max-width: 85%;
      white-space: pre-wrap;
      line-height: 1.45;
      font-size: 0.95rem;
    }
    .msg.usuario {
      align-self: flex-end;
      background: #e8f0fe;
      color: #1d4ed8;
    }
    .msg.agente {
      align-self: flex-start;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      color: #111827;
    }
    .caja-grafico {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 12px;
      width: 100%;
      max-width: 560px;
      align-self: flex-start;
    }
    .controles {
      display: flex;
      gap: 8px;
    }
    #texto {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.95rem;
    }
    button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
      font-weight: 600;
    }
    #btnHablar {
      background: #dc2626;
      color: #ffffff;
    }
    #btnHablar.escuchando {
      background: #991b1b;
    }
    #btnEnviar {
      background: #2563eb;
      color: #ffffff;
    }
    .opcion-voz {
      margin-top: 8px;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #374151;
    }
    .panel-leyenda {
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 14px;
      max-height: 78vh;
      overflow-y: auto;
    }
    .panel-leyenda h2 {
      margin: 0 0 10px 0;
      font-size: 1.1rem;
    }
    .grupo-titulo {
      font-weight: 700;
      font-size: 0.9rem;
      margin: 12px 0 6px 0;
      color: #1f2937;
    }
    .btn-pregunta {
      display: block;
      width: 100%;
      text-align: left;
      background: #f1f5f9;
      color: #1e293b;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 6px;
      font-size: 0.85rem;
      font-weight: 400;
    }
    .btn-pregunta:hover {
      background: #e2e8f0;
    }
    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="contenedor">
    <h1 id="titulo"></h1>
    <div class="layout">
      <div class="panel-chat">
        <div id="chat"></div>
        <div class="controles">
          <input id="texto" type="text" placeholder="Escribe o pulsa Hablar" />
          <button id="btnHablar" type="button">Hablar</button>
          <button id="btnEnviar" type="button">Enviar</button>
        </div>
        <label class="opcion-voz">
          <input id="chkVoz" type="checkbox" checked />
          Respuesta en voz
        </label>
      </div>

      <div class="panel-leyenda">
        <h2>Preguntas para probar</h2>
        <div id="leyenda"></div>
      </div>
    </div>
  </div>

  <script>
    // ===== LO UNICO QUE CAMBIA ENTRE PROYECTOS =====
    const TITULO = "Agente de Reputación de Restaurante";
    const PREGUNTAS = {
      "Consultas": [
        "¿Cuántas reseñas pendientes y urgentes tenemos?",
        "Busca a Lucia Torres.",
        "¿Cuál es el resumen general de reputación del restaurante?",
        "¿Qué reseñas tiene Lucia Torres?",
        "Dame el detalle de la reseña R002."
      ],
      "Gráficos": [
        "Grafica la cantidad de reseñas por plataforma.",
        "Hazme un gráfico de torta de las reseñas por categoría."
      ],
      "Registros": [
        "Registra una reseña de Carlos Mendoza en Google Maps con 5 estrellas en Comida: Excelente ceviche y rápida atención.",
        "Responde a la reseña R002 con cortesía de Postre de cortesía diciendo: Estimada Lucía, lamentamos la demora y te esperamos con un postre de cortesía."
      ]
    };

    document.getElementById("titulo").textContent = TITULO;
    document.title = TITULO;

    const cajaChat = document.getElementById("chat");
    const inputTexto = document.getElementById("texto");
    const btnHablar = document.getElementById("btnHablar");
    const btnEnviar = document.getElementById("btnEnviar");
    const chkVoz = document.getElementById("chkVoz");
    const leyenda = document.getElementById("leyenda");

    // Construir botones de la leyenda lateral
    for (const grupo of Object.keys(PREGUNTAS)) {
      const h = document.createElement("div");
      h.className = "grupo-titulo";
      h.textContent = grupo;
      leyenda.appendChild(h);

      for (const pregunta of PREGUNTAS[grupo]) {
        const boton = document.createElement("button");
        boton.type = "button";
        boton.className = "btn-pregunta";
        boton.textContent = pregunta;
        boton.onclick = () => enviar(pregunta);
        leyenda.appendChild(boton);
      }
    }

    function agregarMensaje(texto, clase) {
      const div = document.createElement("div");
      div.className = "msg " + clase;
      div.textContent = texto;
      cajaChat.appendChild(div);
      cajaChat.scrollTop = cajaChat.scrollHeight;
      return div;
    }

    function dibujarGrafico(grafico) {
      const contenedor = document.createElement("div");
      contenedor.className = "caja-grafico";
      const lienzo = document.createElement("canvas");
      contenedor.appendChild(lienzo);
      cajaChat.appendChild(contenedor);

      const colores = [
        "#60a5fa", "#34d399", "#fbbf24", "#f87171", "#a78bfa", "#fb923c"
      ];

      new Chart(lienzo, {
        type: grafico.tipo || "bar",
        data: {
          labels: grafico.etiquetas,
          datasets: [{
            label: grafico.titulo || "Datos",
            data: grafico.valores,
            backgroundColor: grafico.tipo === "pie" ? colores : "#60a5fa",
            borderColor: "#2563eb",
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          plugins: {
            title: {
              display: true,
              text: grafico.titulo || "Grafico"
            }
          }
        }
      });

      cajaChat.scrollTop = cajaChat.scrollHeight;
    }

    function leerEnVoz(texto) {
      if (!chkVoz.checked || !("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const limpio = texto.replace(/[*#_`]/g, "");
      const locucion = new SpeechSynthesisUtterance(limpio);
      locucion.lang = "es-PE";
      window.speechSynthesis.speak(locucion);
    }

    async function enviar(textoManual) {
      const texto = (textoManual !== undefined ? textoManual : inputTexto.value).trim();
      if (!texto) return;

      inputTexto.value = "";
      agregarMensaje(texto, "usuario");
      const cargando = agregarMensaje("Procesando...", "agente");

      try {
        const respuestaHttp = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ texto })
        });
        const datos = await respuestaHttp.json();

        cargando.textContent = datos.respuesta || "Sin respuesta.";

        if (datos.grafico) {
          dibujarGrafico(datos.grafico);
        }

        leerEnVoz(cargando.textContent);
      } catch (err) {
        cargando.textContent = "Error de conexión con el servidor.";
      }
    }

    btnEnviar.onclick = () => enviar();
    inputTexto.addEventListener("keydown", (e) => {
      if (e.key === "Enter") enviar();
    });

    // Reconocimiento de voz (Chrome / Edge)
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRec) {
      const reconocedor = new SpeechRec();
      reconocedor.lang = "es-PE";
      reconocedor.interimResults = false;

      btnHablar.onclick = () => {
        btnHablar.classList.add("escuchando");
        btnHablar.textContent = "Escuchando...";
        reconocedor.start();
      };

      reconocedor.onresult = (resultado) => {
        const transcrito = resultado.results[0][0].transcript;
        enviar(transcrito);
      };

      reconocedor.onend = () => {
        btnHablar.classList.remove("escuchando");
        btnHablar.textContent = "Hablar";
      };

      reconocedor.onerror = () => {
        btnHablar.classList.remove("escuchando");
        btnHablar.textContent = "Hablar";
      };
    } else {
      btnHablar.disabled = true;
      btnHablar.title = "Usa Microsoft Edge o Google Chrome para dictado por voz.";
    }
  </script>
</body>
</html>
